name: CI

# The console shipped from the melia repository until the split; the job below is the one
# that used to run there, unchanged in substance, with the working directory moved from
# gui/admin to the repository root.
on:
  push:
    branches: [dev, quality, prod]
  pull_request:
    branches: [dev, quality, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads packageManager from package.json, so the pnpm version is declared in one place
      # instead of a second copy here that drifts.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          # Pinned to the version used locally; without it the runner image decides, and the
          # Node version can change under a commit that touched nothing.
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The packages live in their own repository (github.com/ivvanare/crud-maker) and are
      # linked from a sibling checkout, because nothing is published yet. package.json points
      # at ../crud-maker/dist/..., relative to this repository root, so the sibling has to sit
      # one directory beside the checkout — the same shape as a local working copy.
      - name: check out the crud-maker packages beside the workspace
        working-directory: ${{ github.workspace }}/..
        run: git clone --depth 1 https://github.com/ivvanare/crud-maker crud-maker

      - name: install and build the crud-maker packages
        working-directory: ${{ github.workspace }}/../crud-maker
        run: |
          pnpm install --frozen-lockfile
          pnpm exec ng build crud-maker
          pnpm exec ng build crud-maker-zorro

      # --frozen-lockfile is the frontend's 'go mod tidy' gate: a lockfile that does not match
      # package.json fails here instead of drifting silently.
      - name: install
        run: pnpm install --frozen-lockfile

      - name: test the app
        run: npx ng test admin --watch=false

      - name: build
        run: npx ng build

  # The API owns api/openapi.yaml and api/API.md, and this repository consumes a snapshot of them
  # (see contract/ and scripts/sync-contract.sh). The snapshot alone would drift in silence, so
  # this job checks it against the commit contract/UPSTREAM declares. It needs no dependencies and
  # no sibling checkout, which is why it is a separate job instead of another step above.
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the sync script behaves
        run: bash scripts/sync-contract.test.sh

      - name: read the upstream commit the snapshot declares
        id: upstream
        run: |
          commit="$(sed -n 's/^commit: //p' contract/UPSTREAM)"
          # An empty ref would check out the API's default branch and compare against whatever is
          # there, which is the silent drift this job exists to catch: fail loudly instead.
          if [ -z "$commit" ]; then
            echo 'contract/UPSTREAM declares no commit' >&2
            exit 1
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ivvanare/ecosystem_complete
          ref: ${{ steps.upstream.outputs.commit }}
          path: upstream

      - name: the snapshot is the contract of that commit
        run: |
          diff -u upstream/api/openapi.yaml contract/openapi.yaml
          diff -u upstream/api/API.md contract/API.md
